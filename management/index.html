<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢 · 管理中心 · Management Center</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/site-header.css" />
  <link rel="stylesheet" href="/management/management.css" />
</head>
<body class="hub-body">
  <script src="/management/boot.js"></script>
  <!-- The same site header as every other page (Rick, 2026-10-02: 「管理中心仍然可以看到蜂巢的 head」). -->
  <header class="site-header compact" data-site-header></header>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/site-header.js"></script>
  <div class="hub">
    <aside class="side" id="side">
      <div class="side-brand"><span class="tag" id="brandTag">管理中心</span></div>
      <button class="side-hide" id="sideHide" type="button" aria-label="收起导航" title="收起导航"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <nav class="side-nav" id="nav" aria-label="hub"></nav>
      <div class="side-foot" id="foot">
        <button class="who-btn" id="fWho" type="button" aria-haspopup="true" aria-expanded="false" title="账号">
          <span class="avatar" id="fAvatar">…</span>
          <span class="who"><b id="fName">载入中…</b><span id="fUpn"></span></span>
          <svg class="chev" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 12.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="out" id="fOut" type="button">退出</button>
        <div class="acct-menu" id="fMenu" role="menu" hidden></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <button class="side-show" id="sideShow" type="button" aria-label="显示导航" title="显示导航"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="菜单">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 id="title">…</h1>
        <div id="topActions"></div>
      </header>
      <div class="flash" id="flash" role="status" hidden></div>
      <section class="content" id="content"><div class="loading">载入中…</div></section>
    </main>
  </div>
  <div class="panel" id="panel" aria-hidden="true"></div>
  <!-- A second panel, to the left of the first: a member opened from a group's panel (Rick, 2026-10-03). -->
  <div class="panel second" id="panel2" aria-hidden="true"></div>
  <script src="/assets/session-guard.js"></script>
  <script src="/management/management.js"></script>
</body>
</html>
