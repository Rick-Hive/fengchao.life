<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢 · 管理中心 · Management Center</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/site-header.css" />
  <link rel="stylesheet" href="/management/management.css" />
</head>
<body class="hub-body">
  <script>
    // One address for the whole site: the sign-in cookie belongs to the host it was made on.
    if (location.hostname === "www.fengchao.life") location.replace("https://fengchao.life" + location.pathname + location.search + location.hash);
    // Since 2026-10-03 登录 signs in in its own tab, so there is normally no opener
    // and this block does nothing. Kept for a sign-in window opened by hand.
    // Arrived in the sign-in window (opened by 登录 on another tab; ?signedin=1): hand
    // that tab over *before this page renders* and close this window, so the
    // person sees the management center load once, in the tab they started from
    // (Rick, 2026-10-03: 「两次显示重新加载」 — before, this window drew the whole
    // page first, then the other tab drew it again). The other tabs are told once
    // (handed), so the header script does not navigate the opener a second time.
    // If the window cannot be closed, it loads the page itself after a moment.
    (function () {
      if (!/[?&]signedin=1\b/.test(location.search)) return;
      var o = null;
      try { o = window.opener && !window.opener.closed ? window.opener : null; } catch (e) { o = null; }
      if (!o) return;
      var handed = false;
      try { o.location.href = "/management/"; handed = true; } catch (e) { /* cross-origin opener */ }
      if (!handed) return;
      window.__fcHandedOff = true;
      document.documentElement.style.visibility = "hidden";
      try { new BroadcastChannel("fc-auth").postMessage({ kind: "in", at: Date.now(), handed: true }); } catch (e) {}
      try { localStorage.setItem("fc-auth-event", "in:" + Date.now() + ":handed"); } catch (e) {}
      setTimeout(function () { try { window.close(); } catch (e) {} }, 150);
      setTimeout(function () { location.replace("/management/"); }, 2500);
    })();
  </script>
  <!-- The same site header as every other page (Rick, 2026-10-02: 「管理中心仍然可以看到蜂巢的 head」). -->
  <header class="site-header" data-site-header></header>
  <script src="/assets/i18n.js"></script>
  <script src="/assets/site-header.js"></script>
  <div class="hub">
    <aside class="side" id="side">
      <div class="side-brand"><span class="tag" id="brandTag">管理中心</span></div>
      <nav class="side-nav" id="nav" aria-label="hub"></nav>
      <div class="side-foot" id="foot">
        <button class="who-btn" id="fWho" type="button" aria-haspopup="true" aria-expanded="false" title="账号">
          <span class="avatar" id="fAvatar">…</span>
          <span class="who"><b id="fName">载入中…</b><span id="fUpn"></span></span>
          <svg class="chev" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 12.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="out" id="fOut" type="button">退出</button>
        <div class="acct-menu" id="fMenu" role="menu" hidden></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="菜单">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 id="title">…</h1>
        <div id="topActions"></div>
      </header>
      <div class="flash" id="flash" role="status" hidden></div>
      <section class="content" id="content"><div class="loading">载入中…</div></section>
    </main>
  </div>
  <div class="panel" id="panel" aria-hidden="true"></div>
  <!-- A second panel, to the left of the first: a member opened from a group's panel (Rick, 2026-10-03). -->
  <div class="panel second" id="panel2" aria-hidden="true"></div>
  <script src="/assets/session-guard.js"></script>
  <script src="/management/management.js"></script>
</body>
</html>
