<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置流程图 · 蜂巢帮助</title>
  <meta name="description" content="微软 Teams 和身份验证器设置向导的完整流程图：新用户 / 老用户、iPhone / 安卓、自己的 iPad 或管理员代扫，以及以后再次被要求验证时怎么走。" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<style>
  :root {
    --bg: #f2f4f8; --surface: #ffffff; --surface-2: #f8fafc;
    --ink: #1c1c1c; --ink-soft: #333333; --ink-faint: #6b7787; --line: #dde3ec;
    --accent: #1d4a83; --accent-ink: #123a63; --accent-soft: #e8eef5; --accent-soft-line: #c3d3e5;
    --good: #15803d; --good-soft: #e7f2ea; --good-line: #bcdcc8;
    --warn: #b45309; --warn-soft: #fdf0e0; --warn-line: #ecd2ab;
    --shadow: 0 1px 3px rgba(30,41,59,.07), 0 4px 14px rgba(30,41,59,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121821; --surface: #19212c; --surface-2: #1f2835;
      --ink: #e9eef4; --ink-soft: #c2cbd6; --ink-faint: #8593a3;
      --line: #2c3747; --accent: #7db2e8; --accent-ink: #bcd8f2;
      --accent-soft: #1b2b3d; --accent-soft-line: #2f455d;
      --good: #6fc490; --good-soft: #17281f; --good-line: #2f4a39;
      --warn: #e0a250; --warn-soft: #2b2113; --warn-line: #4a3620;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121821; --surface: #19212c; --surface-2: #1f2835;
    --ink: #e9eef4; --ink-soft: #c2cbd6; --ink-faint: #8593a3;
    --line: #2c3747; --accent: #7db2e8; --accent-ink: #bcd8f2;
    --accent-soft: #1b2b3d; --accent-soft-line: #2f455d;
    --good: #6fc490; --good-soft: #17281f; --good-line: #2f4a39;
    --warn: #e0a250; --warn-soft: #2b2113; --warn-line: #4a3620;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Heiti SC", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
    line-height: 1.75; padding: 26px 20px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .site-back { display: flex; align-items: center; gap: 10px; font-size: .9rem; margin-bottom: 12px; }
  .site-back a { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  .site-back a:hover { text-decoration: underline; }
  .site-back img { width: 26px; height: 26px; display: block; }
  .helpnav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .helpnav a {
    text-decoration: none; font-size: .86rem; font-weight: 600; padding: 6px 15px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--accent-ink); background: var(--surface);
  }
  .helpnav a:hover { border-color: var(--accent); }
  .helpnav a[aria-current="page"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mast-top { display: flex; align-items: center; gap: 10px; }
  .eyebrow {
    display: inline-block; font-size: .76rem; font-weight: 600; letter-spacing: .09em;
    color: var(--accent-ink); background: var(--accent-soft); border: 1px solid var(--accent-soft-line);
    padding: 3px 11px; border-radius: 999px; margin-bottom: 11px;
  }
  .lang-btn {
    font: inherit; font-size: .76rem; font-weight: 700; letter-spacing: .04em; margin-bottom: 11px;
    padding: 3px 12px; border-radius: 999px; cursor: pointer; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line);
  }
  .lang-btn:hover { color: var(--accent-ink); border-color: var(--accent-soft-line); }
  h1, h2 { font-family: "Songti SC", "SimSun", "Source Han Serif SC", "Noto Serif CJK SC", serif; margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(1.4rem, 1.1rem + 1.3vw, 1.85rem); font-weight: 700; }
  h2 { font-size: 1.15rem; font-weight: 700; margin: 30px 0 8px; color: var(--accent-ink); }
  .sub { color: var(--ink-soft); margin: 9px 0 0; font-size: .97rem; }
  .toc { margin: 18px 0 0; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: .92rem; }
  .toc b { display: block; margin-bottom: 6px; color: var(--accent-ink); }
  .toc a { color: var(--accent-ink); text-decoration: none; margin-right: 14px; white-space: nowrap; }
  .toc a:hover { text-decoration: underline; }
  details.q { scroll-margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin: 10px 0; box-shadow: var(--shadow); }
  details.q summary { cursor: pointer; font-weight: 700; font-size: 1.02rem; list-style: none; display: flex; gap: 10px; align-items: flex-start; }
  details.q summary::-webkit-details-marker { display: none; }
  details.q summary::before { content: "＋"; color: var(--accent); flex: none; font-weight: 700; }
  details.q[open] summary::before { content: "－"; }
  details.q p { margin: 10px 0 0; color: var(--ink-soft); font-size: .96rem; }
  details.q p strong { color: var(--ink); }
  details.q a { color: var(--accent-ink); }
  details.q code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: .88em; color: var(--accent-ink); }
  .cta { display: inline-block; margin-top: 26px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; border-radius: 999px; padding: 11px 22px; }
  .cta:hover { background: var(--accent-ink); }
  footer.page { margin-top: 38px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: .81rem; }

  /* ---- flowchart page ---- */
  .toolbar {
    position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin: 18px 0 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px 12px 0 0; border-bottom: 0;
  }
  .toolbar button {
    font: inherit; font-size: .88rem; font-weight: 700; min-width: 38px; height: 36px; padding: 0 12px;
    border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent-ink); }
  .toolbar button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .toolbar .zoom-val {
    min-width: 58px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent-ink);
  }
  .toolbar input[type=range] { width: 150px; accent-color: var(--accent); }
  .toolbar .hint { margin-left: auto; font-size: .8rem; color: var(--ink-faint); }
  /* The chart keeps a white ground in dark mode too — its colours are light by design. */
  .viewport {
    background: #ffffff; border: 1px solid var(--line); border-radius: 0 0 12px 12px;
    height: calc(100vh - 150px); min-height: 420px; overflow: auto; cursor: grab;
    box-shadow: var(--shadow); overscroll-behavior: contain; touch-action: pan-x pan-y;
  }
  .viewport.dragging { cursor: grabbing; user-select: none; }
  .canvas { padding: 20px; width: max-content; margin: 0 auto; }
  .flow-svg { display: block; }
  .flow-svg[hidden] { display: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 14px 0 0; font-size: .86rem; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 22px; height: 14px; border-radius: 4px; display: inline-block; border: 1.5px solid; }
  .legend .l-q { background: #e8eef5; border-color: #1d4a83; clip-path: polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%); }
  .legend .l-act { background: #fff; border-color: #9fb3cc; }
  .legend .l-warn { background: #fdf0e0; border-color: #b45309; }
  .legend .l-ok { background: #e7f2ea; border-color: #15803d; border-radius: 999px; }
  .legend .l-side { background: #f8fafc; border-color: #c3d3e5; border-style: dashed; }
  .after { margin-top: 18px; font-size: .93rem; color: var(--ink-soft); }
  .after a { color: var(--accent-ink); font-weight: 700; }
  @media (max-width: 640px) { .toolbar .hint { display: none; } .toolbar input[type=range] { width: 110px; } .viewport { height: calc(100vh - 190px); } }
</style>
</head>

  <footer class="page"><span data-en="Hive Help · Setup flowchart">蜂巢帮助 · 设置流程图</span></footer>
</div>

<script>
(function () {
  "use strict";
  var LANG = "zh";
  try { var s = localStorage.getItem("fc-lang"); if (s === "en" || s === "zh") LANG = s; } catch (e) {}
  if (LANG === "en") {
    document.documentElement.lang = "en";
    document.title = "Setup flowchart · Hive Help";
    Array.prototype.forEach.call(document.querySelectorAll("[data-en]"), function (el) { el.innerHTML = el.getAttribute("data-en"); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-en-label]"), function (el) { el.setAttribute("aria-label", el.getAttribute("data-en-label")); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-en-title]"), function (el) { el.title = el.getAttribute("data-en-title"); });
  }
  var lb = document.getElementById("langBtn");
  lb.textContent = LANG === "en" ? "中文" : "EN";
  lb.addEventListener("click", function () {
    try { localStorage.setItem("fc-lang", LANG === "en" ? "zh" : "en"); } catch (e) {}
    location.reload();
  });

  // One chart per language, both pre-rendered into the page (no external
  // script: CDNs are unreliable from mainland China).
  var svg = null;
  Array.prototype.forEach.call(document.querySelectorAll(".flow-svg"), function (el) {
    if (el.getAttribute("data-lang") === LANG) svg = el; else el.parentNode.removeChild(el);
  });
  var vb = svg.viewBox.baseVal, W = vb.width, H = vb.height;
  var vp = document.getElementById("vp"), range = document.getElementById("zRange"), val = document.getElementById("zVal");
  var MIN = 0.25, MAX = 2, scale = 1;

  function apply(next, cx, cy) {
    next = Math.max(MIN, Math.min(MAX, next));
    // keep the point under the cursor (or the centre) where it is
    var r = vp.getBoundingClientRect();
    if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
    var fx = (vp.scrollLeft + cx) / (W * scale + 40), fy = (vp.scrollTop + cy) / (H * scale + 40);
    scale = next;
    svg.setAttribute("width", Math.round(W * scale));
    svg.setAttribute("height", Math.round(H * scale));
    vp.scrollLeft = fx * (W * scale + 40) - cx;
    vp.scrollTop = fy * (H * scale + 40) - cy;
    var pct = Math.round(scale * 100);
    val.textContent = pct + "%"; range.value = pct;
    try { sessionStorage.setItem("flowZoom", String(scale)); } catch (e) {}
  }
  function fitWidth() {
    var avail = vp.clientWidth - 40;
    // Readable first: never below 55% by default, never above actual size.
    return Math.max(0.55, Math.min(1, avail / W));
  }
  document.getElementById("zIn").addEventListener("click", function () { apply(Math.round((scale + 0.1) * 20) / 20); });
  document.getElementById("zOut").addEventListener("click", function () { apply(Math.round((scale - 0.1) * 20) / 20); });
  document.getElementById("zFit").addEventListener("click", function () { apply(Math.max(MIN, Math.min(1, (vp.clientWidth - 40) / W))); vp.scrollTop = 0; });
  document.getElementById("z100").addEventListener("click", function () { apply(1); });
  range.addEventListener("input", function () { apply(Number(range.value) / 100); });
  vp.addEventListener("wheel", function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    var r = vp.getBoundingClientRect();
    apply(scale * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  vp.addEventListener("keydown", function (e) {
    if (e.key === "+" || e.key === "=") { apply(scale + 0.1); e.preventDefault(); }
    if (e.key === "-" || e.key === "_") { apply(scale - 0.1); e.preventDefault(); }
    if (e.key === "0") { apply(1); e.preventDefault(); }
  });
  // drag to pan (mouse); touch keeps native scrolling
  var drag = null;
  vp.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: vp.scrollLeft, t: vp.scrollTop };
    vp.classList.add("dragging"); vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener("pointermove", function (e) {
    if (!drag) return;
    vp.scrollLeft = drag.l - (e.clientX - drag.x); vp.scrollTop = drag.t - (e.clientY - drag.y);
  });
  function endDrag() { drag = null; vp.classList.remove("dragging"); }
  vp.addEventListener("pointerup", endDrag); vp.addEventListener("pointercancel", endDrag);

  var start = fitWidth();
  try { var z = Number(sessionStorage.getItem("flowZoom")); if (z >= MIN && z <= MAX) start = z; } catch (e) {}
  apply(start);
  vp.scrollTop = 0;
  vp.scrollLeft = Math.max(0, (W * scale + 40 - vp.clientWidth) / 2);
})();
</script>
</body>
</html>
