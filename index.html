<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢 · 选课平台</title>
  <meta name="description" content="蜂巢选课平台：浏览幼儿园至十二年级课程与毕业要求，提交选课订单。" />
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img class="logo-mark" src="/assets/logo-mark.png" width="512" height="512" alt="蜂巢" />
      <div class="brand-lockup">
        <div class="brand-line">
          <span class="brand-name">蜂巢</span>
          <span class="brand-values" id="brandValues"></span>
        </div>
        <div class="brand-tag" id="brandTag">以线上资源推动线下C教育生态重建</div>
      </div>
      <div class="header-spacer"></div>
      <nav class="site-nav" id="siteNav" aria-label="site"></nav>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="siteNav">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="navToggleLabel">菜单</span>
      </button>
      <button class="cart-btn" id="cartBtn" type="button" aria-haspopup="dialog" hidden>
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path d="M2.6 3.4h2.1l1.9 9.3a1.6 1.6 0 0 0 1.6 1.3h6.2a1.6 1.6 0 0 0 1.6-1.25L17.4 6.6H6.1"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="8.6" cy="17" r="1.3" fill="currentColor"/><circle cx="14.8" cy="17" r="1.3" fill="currentColor"/>
        </svg>
        <span class="cart-btn-n" id="cartBtnN">0</span>
      </button>
      <button class="lang-btn" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="wrap">
    <nav class="stepper" id="stepper" aria-label="steps"></nav>
    <div id="app">
      <div class="notice" id="loadingNotice">正在加载… / Loading…</div>
    </div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="cart-inner">
      <button class="cart-info" id="cartInfo" type="button" aria-haspopup="dialog"></button>
      <button class="btn btn-primary" id="cartNext" type="button"></button>
    </div>
  </div>

  <script src="/assets/i18n.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
