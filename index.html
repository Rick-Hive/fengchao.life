<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>蜂巢 · 选课平台</title>
  <meta name="description" content="蜂巢选课平台：浏览幼儿园至十二年级课程与毕业要求，提交选课订单。" />
  <link rel="stylesheet" href="/assets/app.css" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img class="logo-mark" src="/assets/logo-mark.png" width="512" height="512" alt="蜂巢" />
      <div class="brand-lockup">
        <div class="brand-line">
          <span class="brand-name">蜂巢</span>
          <span class="brand-values" id="brandValues"></span>
        </div>
      </div>
      <div class="header-spacer"></div>
      <nav class="site-nav" id="siteNav" aria-label="site"></nav>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="siteNav">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="navToggleLabel">菜单</span>
      </button>
      <button class="cart-btn" id="cartBtn" type="button" aria-haspopup="dialog">
        <span class="cart-ic">
          <svg viewBox="0 0 34 30" width="34" height="30" aria-hidden="true">
            <path d="M1.5 3h4.2l3.6 16.2a2.2 2.2 0 0 0 2.15 1.7h13.4a2.2 2.2 0 0 0 2.15-1.7L30.5 9H8.2"
                  fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="13" cy="26.2" r="2.3" fill="currentColor"/><circle cx="24.6" cy="26.2" r="2.3" fill="currentColor"/>
          </svg>
          <span class="cart-btn-n zero" id="cartBtnN">0</span>
        </span>
        <span class="cart-lbl" id="cartLbl">购物车</span>
      </button>
      <button class="lang-btn" id="langBtn" type="button">EN</button>
    </div>
    <div class="header-tagline-row">
      <div class="brand-tag" id="brandTag">以线上资源推动线下C教育生态重建</div>
    </div>
  </header>

  <main class="wrap">
    <nav class="stepper" id="stepper" aria-label="steps"></nav>
    <div id="app">
      <div class="notice" id="loadingNotice">正在加载… / Loading…</div>
    </div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="cart-inner">
      <button class="cart-info" id="cartInfo" type="button" aria-haspopup="dialog"></button>
      <button class="btn btn-primary" id="cartNext" type="button"></button>
    </div>
  </div>

  <script src="/assets/i18n.js"></script>
  <script src="/assets/gpa.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
