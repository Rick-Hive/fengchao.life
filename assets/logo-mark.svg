<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 660 660" role="img" aria-label="蜂巢 Fengchao">
  <!-- The viewBox is padded past the artwork so the bee has air to fly in;
       the icons are rendered from this same file with the tight 0 0 600 600 box. -->
  <title>蜂巢 Fengchao</title>
  <style>
    /* A parked bee replaces the flying one when the viewer asks for less motion. */
    #parked { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) {
      #flight { visibility: hidden; }
      #parked { visibility: visible; }
    }
  </style>
  <defs>
    <path id="orbit" d="M300.0 54.1 C289.4 54.9 278.5 57.4 268.6 61.1 C258.6 64.9 248.9 70.5 240.2 76.6 C231.4 82.8 223.5 90.5 216.3 97.8 C209.0 105.2 202.8 113.4 196.6 120.9 C190.4 128.4 185.1 135.8 179.2 142.6 C173.4 149.4 167.8 155.6 161.6 161.6 C155.4 167.6 148.8 172.9 141.9 178.7 C135.1 184.5 127.5 190.0 120.4 196.3 C113.3 202.7 105.7 209.3 99.2 216.8 C92.7 224.3 86.3 232.6 81.5 241.4 C76.7 250.3 72.7 260.0 70.3 269.8 C67.9 279.5 66.9 289.9 67.0 300.0 C67.1 310.1 68.8 320.3 71.0 330.1 C73.2 340.0 76.7 349.6 80.3 358.9 C84.0 368.1 88.3 377.1 92.7 385.8 C97.2 394.6 101.9 403.1 106.9 411.5 C111.9 419.9 117.0 428.1 122.8 436.0 C128.5 443.9 134.5 451.7 141.2 458.8 C148.0 465.8 155.3 472.6 163.2 478.3 C171.0 484.1 179.6 489.1 188.5 493.2 C197.3 497.2 206.8 500.2 216.1 502.5 C225.5 504.8 235.1 505.9 244.5 506.9 C253.9 508.0 263.3 508.1 272.5 508.6 C281.8 509.1 290.8 509.2 300.0 509.7 C309.2 510.2 318.3 510.9 327.9 511.6 C337.4 512.2 347.1 513.3 357.2 513.6 C367.3 514.0 378.0 514.4 388.4 513.5 C398.9 512.6 409.9 511.1 420.1 508.0 C430.3 504.9 440.6 500.6 449.4 494.8 C458.3 489.0 466.6 481.5 473.3 473.3 C479.9 465.0 485.3 455.2 489.4 445.3 C493.4 435.4 495.8 424.5 497.5 414.0 C499.2 403.6 499.5 392.8 499.7 382.7 C500.0 372.6 499.3 362.8 499.1 353.4 C498.9 343.9 498.5 335.0 498.6 326.1 C498.6 317.3 499.0 308.8 499.4 300.0 C499.8 291.2 500.7 282.5 501.0 273.5 C501.2 264.6 501.7 255.3 501.1 246.1 C500.5 236.9 499.5 227.4 497.5 218.2 C495.4 209.0 492.5 199.8 488.8 191.0 C485.1 182.2 480.3 173.7 475.1 165.6 C469.9 157.6 463.8 149.9 457.5 142.5 C451.1 135.1 444.3 128.1 437.2 121.3 C430.0 114.4 422.6 107.7 414.8 101.2 C406.9 94.8 398.8 88.3 390.0 82.6 C381.3 76.9 372.1 71.2 362.5 66.9 C352.8 62.5 342.5 58.6 332.1 56.5 C321.6 54.4 310.6 53.4 300.0 54.1 Z"/>
    <clipPath id="abdomen"><ellipse cx="-8" cy="0" rx="17.5" ry="11.6"/></clipPath>
    <g id="bee">
      <!-- Wings, in the original mark's style: slender outlined blades, not soft
           filled ellipses. Each flutters about its own root near the thorax. -->
      <g class="wing">
        <ellipse cx="-6.6" cy="-18.2" rx="19.5" ry="6.4" transform="rotate(40 -6.6 -18.2)"
                 fill="#ffffff" stroke="#241e17" stroke-width="1.7"/>
        <animateTransform attributeName="transform" type="rotate" additive="sum"
          values="0 8 -6; -22 8 -6; 0 8 -6" dur=".13s" repeatCount="indefinite"/>
      </g>
      <g class="wing">
        <ellipse cx="-6.6" cy="18.2" rx="19.5" ry="6.4" transform="rotate(-40 -6.6 18.2)"
                 fill="#ffffff" stroke="#241e17" stroke-width="1.7"/>
        <animateTransform attributeName="transform" type="rotate" additive="sum"
          values="0 8 6; 22 8 6; 0 8 6" dur=".13s" repeatCount="indefinite"/>
      </g>
      <!-- stinger -->
      <path d="M-25 0 l-7.5 0" stroke="#241e17" stroke-width="2.6" stroke-linecap="round"/>
      <!-- abdomen: gold with three black bands, clipped to the body outline -->
      <g clip-path="url(#abdomen)">
        <ellipse cx="-8" cy="0" rx="17.5" ry="11.6" fill="#e8b34a"/>
        <rect x="-23.5" y="-13" width="5.4" height="26" fill="#241e17"/>
        <rect x="-13.6" y="-13" width="5.6" height="26" fill="#241e17"/>
        <rect x="-3.4"  y="-13" width="5.8" height="26" fill="#241e17"/>
      </g>
      <!-- thorax + head -->
      <ellipse cx="9.5" cy="0" rx="9" ry="9.4" fill="#241e17"/>
      <circle cx="20" cy="0" r="7.6" fill="#241e17"/>
      <!-- two eyes -->
      <circle cx="23" cy="-3.7" r="2.5" fill="#ffffff"/>
      <circle cx="23" cy="3.7"  r="2.5" fill="#ffffff"/>
      <circle cx="24.1" cy="-3.7" r="1.25" fill="#241e17"/>
      <circle cx="24.1" cy="3.7"  r="1.25" fill="#241e17"/>
      <!-- antennae -->
      <path d="M22.5 -5.6 q6.5 -4.5 9.5 -9.5" fill="none" stroke="#241e17" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M22.5 5.6 q6.5 4.5 9.5 9.5"  fill="none" stroke="#241e17" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="32.6" cy="-15.4" r="1.9" fill="#241e17"/>
      <circle cx="32.6" cy="15.4"  r="1.9" fill="#241e17"/>
    </g>
  </defs>

  <!-- honeycomb: six cells around a darker centre carrying the cross -->
  <g>
    <path fill="#e7c48a" d="M365.0 183.5 L332.5 239.8 L267.5 239.8 L235.0 183.5 L267.5 127.2 L332.5 127.2 Z"/>
    <path fill="#e0ad58" d="M264.0 241.5 L231.5 297.8 L166.5 297.8 L134.0 241.5 L166.5 185.2 L231.5 185.2 Z"/>
    <path fill="#e5c185" d="M466.0 241.5 L433.5 297.8 L368.5 297.8 L336.0 241.5 L368.5 185.2 L433.5 185.2 Z"/>
    <path fill="#e5bd7d" d="M264.0 358.5 L231.5 414.8 L166.5 414.8 L134.0 358.5 L166.5 302.2 L231.5 302.2 Z"/>
    <path fill="#deaa52" d="M466.0 358.5 L433.5 414.8 L368.5 414.8 L336.0 358.5 L368.5 302.2 L433.5 302.2 Z"/>
    <path fill="#ddac52" d="M365.0 416.5 L332.5 472.8 L267.5 472.8 L235.0 416.5 L267.5 360.2 L332.5 360.2 Z"/>
    <path fill="#c18d41" d="M365.0 300.0 L332.5 356.3 L267.5 356.3 L235.0 300.0 L267.5 243.7 L332.5 243.7 Z"/>
  </g>
  <path fill="#ffffff" d="M292 257 h16 v25 h16 v16 h-16 v45 h-16 v-45 h-16 v-16 h16 Z"/>

  <!-- the ring the bee flies -->
  <path d="M265.00 81.21A70.00 70.00 0 0 1 335.00 81.21 L471.98 160.29A70.00 70.00 0 0 1 506.98 220.91 L506.98 379.09A70.00 70.00 0 0 1 471.98 439.71 L335.00 518.79A70.00 70.00 0 0 1 265.00 518.79 L128.02 439.71A70.00 70.00 0 0 1 93.02 379.09 L93.02 220.91A70.00 70.00 0 0 1 128.02 160.29 Z" fill="none" stroke="#e0af56" stroke-width="10" stroke-linejoin="round"/>

  <!-- Flight, not a track ride: the loop wanders across the ring, the body
       rolls off the tangent, and the bee weaves and rises as it goes. -->
  <g id="flight">
    <g>
      <g>
        <g>
          <use href="#bee" transform="scale(1.28)"/>
          <!-- rise and fall, as if working the air -->
          <animateTransform attributeName="transform" type="scale" additive="sum"
            values="1;1.05;0.97;1" dur="3.7s" repeatCount="indefinite" calcMode="spline"
            keyTimes="0;0.33;0.7;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
        </g>
        <!-- weave across the line of travel -->
        <animateTransform attributeName="transform" type="translate" additive="sum"
          values="0 -10; 0 11; 0 -10" dur="1.45s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <!-- the body is never rigidly tangent to the path -->
        <animateTransform attributeName="transform" type="rotate" additive="sum"
          values="-13; 11; -13" dur="2.9s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.5;1" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </g>
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto"
        calcMode="spline" keyPoints="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" keyTimes="0.0000;0.1024;0.1857;0.2500;0.3143;0.3976;0.5000;0.6024;0.6857;0.7500;0.8143;0.8976;1.0000"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1">
        <mpath href="#orbit"/>
      </animateMotion>
    </g>
  </g>
  <g id="parked" transform="translate(300 52) scale(1.28)"><use href="#bee" transform="rotate(180)"/></g>
</svg>
